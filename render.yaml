services:
  - type: web
    name: its-agro-programacao-embarque
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22.13.0'
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ROUTES_PROVIDER
        sync: false
      - key: ROUTES_API_KEY
        sync: false
      - key: GEOCODING_PROVIDER
        value: nominatim
      - key: NEXT_PUBLIC_GEOCODING_PROVIDER
        value: nominatim
      - key: NEXT_PUBLIC_MAP_PROVIDER
        value: openstreetmap
      - key: NEXT_PUBLIC_APP_URL
        sync: false
